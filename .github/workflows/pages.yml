name: Benutzerhandbuch veröffentlichen

# Hinweis: Die Organisation VdUE-e-V erlaubt nur Actions aus eigenen Repositories.
# Dieser Workflow kommt deshalb ganz ohne fremde Actions aus (kein "uses:").
# Er baut die Seite und legt das Ergebnis in den Branch "gh-pages".
# GitHub Pages muss auf "Deploy from a branch" → gh-pages / (root) stehen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Quellen holen
        run: |
          git init -q src
          cd src
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: MkDocs installieren
        working-directory: src
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      # --strict bricht bei kaputten Links und fehlenden Bildern ab
      - name: Seite bauen
        working-directory: src
        run: .venv/bin/mkdocs build --strict

      - name: Nach gh-pages veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: src/site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Benutzerhandbuch veröffentlicht (${GITHUB_SHA::7})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
